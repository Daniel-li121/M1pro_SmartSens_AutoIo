[OTP_DPC]
OffsetX=0 //
OffsetY=0 //
TimesX=1//cls X坐标输出需要乘以的倍数，x=cls_x*TimesX+OffsetX
TimesY=1//cls Y坐标输出需要乘以的倍数，y=cls_y*TimesY+OffsetY
MaxSizeX=3 //X方向最大size
MaxSizeY=3 //Y方向最大Size
MinSize=2  //最小Size，1：单点坏点模式；2：cluster坏点模式
MaxClsCnt=990 //最大Cls数目
RowMaxClsCnt=3 //4行最大Cls数目
RowMaxClsCnt_RowCnt=5 //新增n行m个坏点 rule参数配置
RowMaxClsCnt_ClusterCnt=3//新增n行m个坏点 rule参数配置
MidOTPThreshold=0.1500
DarkOTPThreshold=48 //Dark 白点阈值，MeanThread处理方法
Thres_Rows=4
Thres_Cols=4
Thres_MidCenterThres=0.25
Thres_MidEdgeThres=0.28
Thres_DarkCenterThres=40
Thres_DarkEdgeThres=40
Thres_CenterRegion={(1,1),(2,2)}//只有两个点，开始和结束
YIndexBitShift=0 //y坐标bit偏移量[12~0]
YClusterBitShift=13 //y cluster类型bit偏移量[14~13]
XIndexBitShift=15 //x坐标bit偏移量[28~15]
XClusterBitShift=29 //x cluster类型bit偏移量[30~29]。所有信息总共占4Bytes，不同项目，总共占用字节信息不同，根据需求设置
Gain=0.0000
ImgInput=1
ClusterGap=4
ClusterGap_Vertical=4//Cls y方向上的间隔pix
ClusterGap_Horizontal=2//Cls x方向上的间隔pix
iHWBin=1000
iPriority=0
ModeMask=0 //NC
OffsetX_CycleJudge=16 //OffsetX 仅在判断同cycle 使用
CycleCnt=16  //1cycle pixel个数
22OddEvenExpand=0 //500XS(QC pattern格式数据) 2*2以内做奇偶扩展，开关设置，默认打开
PDArea_OffsetX=16//PD area的x坐标偏移量
PDArea_OffsetY=12//PD area的y坐标偏移量
PDArea_Height=1560//PD area的高度
PDArea_Width=2256//PD area的宽度
PDArea_Flag=0//PD area的PD单元分布
//注：PDArea_Flag=0时，PDCell_Height，PDCell_Width，PD_Points才可以配置，二者只能用一组。
PDCell_Height=8
PDCell_Width=8
PD_Points={(2,0),(0,4)}//{}内PD坐标个数不限
DPC_Version=V21bayer
DPC_PixelNum=1
PD_NotMatchRule_Reinsert=0
Pass_Contain2G=1
Pass_2PixExistPD=1
Pass_ClsContainPD=1
OTP1_MaxClsCnt=90//OTP1 存放cls上限
OTP2_MaxClsCnt=200//OTP2 存放cls上限
OTP2_MaxClsCnt_Exp=700//5000cs bayer补充OTP2空间。其余双2.0项目，该参数与OTP2_MaxClsCnt。
MidMeanFilterRemovePD=0//仅支持双otpdpc2.0，在亮场图像均值滤波时去掉PD点       
5000CS_V2H2_Coords_Special=1//5000cs v2h2 rule3-4坐标特殊处理开关
ROILeft=-1
ROIRight=-1
ROITop=-1
ROIBottom=-1
Pass_AllRule=0
OTP_5A0_20_MaxClsCnt=500//5A0 2.2OTP存放cls上限
MaxClsSizeStop=-1//最大cls size，若有cls的xsize*ysize>=MaxClsSizeStop，则不进行处理，直接返回-1,链表为空。-1表示不设置限制
MaxClsNumStop=-1//若图像检测到Cls数量超过iMaxClsNumStop，停止处理,，直接返回-1，链表为空。-1表示不设置限制

HLThreshold=247//530xs高亮区域标记阈值
HLCircleRegion=0//530xs高亮区域是否是矩形，0表示是矩形，1表示是圆形
HLCalibrationRegion={(1000, 1000) , (4000, 4000)}//530xs高亮区域框选起始坐标和结束坐标（x,y）,左右闭区间
HLThreshold_SingChl=247//530xs高亮区域G通道标记阈值
HLCircleRegion_SingChl=0//530xs高亮区域是否是矩形，0表示是矩形，1表示是圆形。（G通道）
HLCalibrationRegion_SingChl={(0, 0) , (400, 400)}//530xs高亮区域框选起始坐标和结束坐标（x,y）,坐标为4的倍数，左右闭区间。（G通道）
Remove2SizeCls=1//是否不标记1*2或者2*1的cls，1不标记，0标记。只用于通用单2.0接口。

